[package]
name = "speedcool"
version = "1.0.0"
edition = "2021"
description = "SpeedCool Linux — Intelligent system optimizer for Linux"
authors = ["Llucs <c307lucas@gmail.com>"]
license = "MIT"
repository = "https://github.com/Llucs/SpeedCool-Linux"
homepage = "https://speedcool.dev"
keywords = ["linux", "performance", "optimization", "cpu", "gpu"]
categories = ["system", "command-line-interface", "hardware-support"]

[dependencies]
clap = { version = "4", features = ["derive", "env", "unicode"] }
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
semver = "1"
chrono = "0.4"
ctrlc = "3.4"
glob = "0.3"
clap_complete = "4"
which = "7"
dirs = "6"

[[bin]]
name = "speedcool"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
